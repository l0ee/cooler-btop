name: Cooler btop CI

"on":
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

concurrency:
  group: cooler-btop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.9", "3.14" ]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install package and test dependencies
      run: |
        python -m pip install -r requirements.lock
        python -m pip install '.[test]' 'setuptools>=61' wheel

    - name: Verify dependency resolution
      run: python -m pip check

    - name: Read project version
      id: project_version
      run: echo "version=$(python -c 'import importlib.metadata; print(importlib.metadata.version("cooler-btop"))')" >> "$GITHUB_OUTPUT"

    - name: Run unit tests
      run: make test PYTHON=python VERSION="${{ steps.project_version.outputs.version }}"

    - name: Run coverage gate
      if: matrix.python-version == '3.14'
      run: make coverage PYTHON=python

    - name: Run daemon stress smoke
      if: matrix.python-version == '3.14'
      env:
        COOLER_BTOP_STRESS_DURATION: "5"
      run: python stress_test.py

    - name: Build wheel and source distribution
      run: make distributions PYTHON=python VERSION="${{ steps.project_version.outputs.version }}"

    - name: Check reproducible distributions
      if: matrix.python-version == '3.14'
      run: make reproducibility-check PYTHON=python

    - name: Inspect distribution artifacts
      run: |
        version="${{ steps.project_version.outputs.version }}"
        test -f "dist/cooler_btop-${version}-py3-none-any.whl"
        test -f "dist/cooler_btop-${version}.tar.gz"

    - name: Smoke test installed wheel outside source
      run: |
        version="${{ steps.project_version.outputs.version }}"
        wheel=$(realpath "dist/cooler_btop-${version}-py3-none-any.whl")
        lock=$(realpath requirements.lock)
        smoke_dir=$(mktemp -d)
        cleanup() {
          if [ -n "${daemon_pid:-}" ] && kill -0 "$daemon_pid" 2>/dev/null; then
            kill -TERM "$daemon_pid" 2>/dev/null || true
            wait "$daemon_pid" 2>/dev/null || true
          fi
          rm -rf -- "$smoke_dir"
        }
        trap cleanup EXIT
        python -m venv "$smoke_dir/venv"
        cd "$smoke_dir"
        "$smoke_dir/venv/bin/python" -m pip install -r "$lock"
        "$smoke_dir/venv/bin/python" -m pip install --no-deps "$wheel"
        "$smoke_dir/venv/bin/cooler-btop" --version
        port=$("$smoke_dir/venv/bin/python" -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')
        "$smoke_dir/venv/bin/cooler-btop" --daemon --port "$port" --interval 0.2 >daemon.log 2>&1 &
        daemon_pid=$!
        ready=0
        for ((attempt = 1; attempt <= 50; attempt++)); do
          if "$smoke_dir/venv/bin/python" - "$port" <<'PY'
        import json
        import sys
        import urllib.request

        port = sys.argv[1]
        with urllib.request.urlopen(
            f"http://127.0.0.1:{port}/api/metrics", timeout=1
        ) as response:
            assert response.status == 200
            payload = json.load(response)
        assert "cpu" in payload and "mem" in payload and "sys" in payload
        PY
          then
            ready=1
            break
          fi
          sleep 0.1
        done
        test "$ready" -eq 1
        kill -TERM "$daemon_pid"
        wait "$daemon_pid"
        daemon_pid=

  fedora-release:
    runs-on: ubuntu-24.04
    container: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
    timeout-minutes: 30

    steps:
    - name: Install Fedora build dependencies
      run: |
        dnf --assumeyes --setopt=install_weak_deps=False install \
          appstream \
          cpio \
          desktop-file-utils \
          git \
          make \
          pyproject-rpm-macros \
          python3-devel \
          python3-pip \
          python3-psutil \
          python3-pyyaml \
          python3-requests \
          python3-rich \
          python3-setuptools \
          python3-textual \
          python3-wheel \
          rpm-build

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Read project version
      id: project_version
      run: echo "version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"

    - name: Build and validate release artifacts
      run: make release

    - name: Verify release checksums
      run: cd dist && sha256sum --check SHA256SUMS

    - name: Confirm package was not installed
      run: |
        set +e
        query_output=$(LC_ALL=C rpm -q cooler-btop 2>&1)
        query_status=$?
        set -e
        test "$query_status" -eq 1
        test "$query_output" = "package cooler-btop is not installed"

    - name: Upload Fedora release artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: fedora-44-release-files
        path: |
          dist/cooler-btop-${{ steps.project_version.outputs.version }}-1.fc44.noarch.rpm
          dist/cooler-btop-${{ steps.project_version.outputs.version }}-1.fc44.src.rpm
          dist/cooler_btop-${{ steps.project_version.outputs.version }}-py3-none-any.whl
          dist/cooler_btop-${{ steps.project_version.outputs.version }}.tar.gz
          dist/SHA256SUMS
        if-no-files-found: error
        retention-days: 7
