name: Cooler btop release

"on":
  push:
    tags: [ "v*" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      version: ${{ steps.project_version.outputs.version }}

    steps:
    - name: Install Fedora build dependencies
      run: |
        dnf --assumeyes --setopt=install_weak_deps=False install \
          appstream \
          cpio \
          desktop-file-utils \
          git \
          make \
          pyproject-rpm-macros \
          python3-devel \
          python3-pip \
          python3-psutil \
          python3-pyyaml \
          python3-requests \
          python3-rich \
          python3-setuptools \
          python3-textual \
          python3-wheel \
          rpm-build

    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - name: Require tag to match project version
      id: project_version
      run: |
        expected_tag="v$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
        echo "version=${expected_tag#v}" >> "$GITHUB_OUTPUT"
        test "$GITHUB_REF_NAME" = "$expected_tag"

    - name: Build and validate release artifacts
      run: make release

    - name: Verify release checksums
      run: cd dist && sha256sum --check SHA256SUMS

    - name: Attest release artifacts
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-checksums: dist/SHA256SUMS

    - name: Confirm package was not installed
      run: |
        set +e
        query_output=$(LC_ALL=C rpm -q cooler-btop 2>&1)
        query_status=$?
        set -e
        test "$query_status" -eq 1
        test "$query_output" = "package cooler-btop is not installed"

    - name: Upload release artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: release-files
        path: |
          dist/cooler-btop-${{ steps.project_version.outputs.version }}-1.fc44.noarch.rpm
          dist/cooler-btop-${{ steps.project_version.outputs.version }}-1.fc44.src.rpm
          dist/cooler_btop-${{ steps.project_version.outputs.version }}-py3-none-any.whl
          dist/cooler_btop-${{ steps.project_version.outputs.version }}.tar.gz
          dist/SHA256SUMS
        if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
    - name: Download release artifacts
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
      with:
        name: release-files
        path: dist

    - name: Verify downloaded artifacts
      run: |
        test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 5
        cd dist
        sha256sum --check SHA256SUMS

    - name: Create GitHub release
      env:
        GH_REPO: ${{ github.repository }}
        GH_TOKEN: ${{ github.token }}
      run: >-
        gh release create "$GITHUB_REF_NAME"
        dist/cooler-btop-${{ needs.build.outputs.version }}-1.fc44.noarch.rpm
        dist/cooler-btop-${{ needs.build.outputs.version }}-1.fc44.src.rpm
        dist/cooler_btop-${{ needs.build.outputs.version }}-py3-none-any.whl
        dist/cooler_btop-${{ needs.build.outputs.version }}.tar.gz
        dist/SHA256SUMS
        --verify-tag --generate-notes
