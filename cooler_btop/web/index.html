<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cooler btop dashboard</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #071013;
            --surface: #101c21;
            --surface-raised: #16262c;
            --edge: #294047;
            --text: #e7f0ec;
            --muted: #90a6a7;
            --mint: #a3e6ba;
            --amber: #efb078;
            --blue: #82c9d7;
            --rose: #de938a;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-width: 320px;
            background:
                radial-gradient(circle at 15% 0%, #17302f 0, transparent 30rem),
                linear-gradient(145deg, var(--bg), #0b1519 55%, #061013);
            color: var(--text);
            font: 15px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        }

        main {
            width: min(1500px, calc(100% - 32px));
            margin: 0 auto;
            padding: 28px 0 40px;
        }

        header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: 22px;
        }

        h1, h2, p { margin: 0; }
        h1 { color: var(--mint); font-size: clamp(1.45rem, 4vw, 2.4rem); letter-spacing: -0.06em; }
        h2 { font-size: 0.88rem; letter-spacing: 0.08em; text-transform: uppercase; }

        .eyebrow { color: var(--muted); font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; }
        .connection { color: var(--amber); font-size: 0.75rem; text-align: right; }
        .connection.live { color: var(--mint); }

        .stats, .charts {
            display: grid;
            gap: 12px;
        }

        .stats { grid-template-columns: repeat(6, minmax(0, 1fr)); margin-bottom: 12px; }
        .charts { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 12px; }

        .stat, .panel {
            border: 1px solid var(--edge);
            border-radius: 8px;
            background: color-mix(in srgb, var(--surface) 94%, transparent);
            box-shadow: 0 15px 40px rgb(0 0 0 / 18%);
        }

        .stat { min-width: 0; padding: 12px; }
        .stat-label { color: var(--muted); display: block; font-size: 0.68rem; letter-spacing: 0.12em; }
        .stat-value { display: block; margin-top: 4px; overflow: hidden; color: var(--mint); font-size: 0.9rem; text-overflow: ellipsis; white-space: nowrap; }

        .panel { padding: 15px; }
        .chart-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
        .legend { color: var(--muted); font-size: 0.68rem; white-space: nowrap; }
        .legend span::before { content: ""; display: inline-block; width: 7px; height: 7px; margin: 0 5px 0 10px; border-radius: 50%; background: currentColor; }
        .legend span:first-child::before { margin-left: 0; }
        .mint { color: var(--mint); }
        .blue { color: var(--blue); }
        .amber { color: var(--amber); }
        .rose { color: var(--rose); }

        canvas { display: block; width: 100%; height: 180px; }

        .process-head { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 12px; }
        input {
            width: min(340px, 100%);
            border: 1px solid var(--edge);
            border-radius: 5px;
            outline: none;
            background: var(--bg);
            color: var(--text);
            font: inherit;
            padding: 8px 10px;
        }
        input:focus { border-color: var(--mint); }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border-bottom: 1px solid var(--edge); padding: 9px 12px; text-align: left; }
        th { color: var(--muted); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; }
        th button { border: 0; background: transparent; color: inherit; cursor: pointer; font: inherit; letter-spacing: inherit; text-transform: inherit; }
        th button:hover, th button:focus-visible { color: var(--mint); }
        td.numeric, th.numeric { text-align: right; }
        tbody tr:hover { background: var(--surface-raised); }
        .empty { color: var(--muted); padding: 28px 12px; text-align: center; }

        @media (max-width: 1100px) {
            .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
            .charts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }

        @media (max-width: 620px) {
            main { width: min(100% - 20px, 1500px); padding-top: 18px; }
            header, .process-head { align-items: stretch; flex-direction: column; }
            .connection { text-align: left; }
            .stats, .charts { grid-template-columns: 1fr; }
            input { width: 100%; }
            canvas { height: 150px; }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <div>
                <p class="eyebrow">Linux telemetry / read only</p>
                <h1>COOLER BTOP</h1>
            </div>
            <p id="connection" class="connection">WAITING FOR METRICS</p>
        </header>

        <section class="stats" aria-label="System summary">
            <div class="stat"><span class="stat-label">HOST</span><span id="sys-host" class="stat-value">...</span></div>
            <div class="stat"><span class="stat-label">KERNEL</span><span id="sys-kernel" class="stat-value">...</span></div>
            <div class="stat"><span class="stat-label">UPTIME</span><span id="sys-uptime" class="stat-value">...</span></div>
            <div class="stat"><span class="stat-label">TASKS</span><span id="sys-tasks" class="stat-value">...</span></div>
            <div class="stat"><span class="stat-label">OPEN FDS</span><span id="sys-fds" class="stat-value">...</span></div>
            <div class="stat"><span class="stat-label">CPU TEMP</span><span id="sys-temp" class="stat-value">...</span></div>
        </section>

        <section class="charts" aria-label="Metric history">
            <article class="panel">
                <div class="chart-head"><h2>CPU Usage</h2><span class="legend"><span class="rose">CPU %</span></span></div>
                <canvas id="cpu-chart" aria-label="CPU usage history"></canvas>
            </article>
            <article class="panel">
                <div class="chart-head"><h2>Memory</h2><span class="legend"><span class="mint">RAM</span><span class="blue">Swap</span></span></div>
                <canvas id="mem-chart" aria-label="Memory usage history"></canvas>
            </article>
            <article class="panel">
                <div class="chart-head"><h2>Network KB/s</h2><span class="legend"><span class="blue">Down</span><span class="amber">Up</span></span></div>
                <canvas id="net-chart" aria-label="Network traffic history"></canvas>
            </article>
            <article class="panel">
                <div class="chart-head"><h2>Disk MB/s</h2><span class="legend"><span class="mint">Read</span><span class="rose">Write</span></span></div>
                <canvas id="disk-chart" aria-label="Disk IO history"></canvas>
            </article>
        </section>

        <section class="panel" aria-labelledby="process-title">
            <div class="process-head">
                <h2 id="process-title">Top Processes</h2>
                <input type="search" id="proc-filter" placeholder="Filter by process or PID" aria-label="Filter processes">
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th><button type="button" data-sort="pid">PID</button></th>
                            <th><button type="button" data-sort="name">Name</button></th>
                            <th class="numeric"><button type="button" data-sort="cpu_percent">CPU %</button></th>
                            <th class="numeric"><button type="button" data-sort="memory_percent">MEM %</button></th>
                        </tr>
                    </thead>
                    <tbody id="process-list"><tr><td colspan="4" class="empty">Waiting for a sample...</td></tr></tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        'use strict';

        class HistoryGraph {
            constructor(id, series, maximum = null) {
                this.canvas = document.getElementById(id);
                this.context = this.canvas.getContext('2d');
                this.series = series.map(item => ({...item, values: Array(60).fill(0)}));
                this.maximum = maximum;
                this.resize();
            }

            resize() {
                const ratio = window.devicePixelRatio || 1;
                const bounds = this.canvas.getBoundingClientRect();
                this.canvas.width = Math.max(1, Math.round(bounds.width * ratio));
                this.canvas.height = Math.max(1, Math.round(bounds.height * ratio));
                this.draw();
            }

            update(values) {
                this.series.forEach((item, index) => {
                    const value = Number(values[index]);
                    item.values.push(Number.isFinite(value) ? Math.max(0, value) : 0);
                    item.values.shift();
                });
                this.draw();
            }

            draw() {
                const context = this.context;
                const width = this.canvas.width;
                const height = this.canvas.height;
                const ratio = window.devicePixelRatio || 1;
                const inset = 24 * ratio;
                const graphWidth = Math.max(1, width - inset * 2);
                const graphHeight = Math.max(1, height - inset * 1.5);
                const observed = this.series.flatMap(item => item.values);
                const maximum = this.maximum || Math.max(1, ...observed) * 1.15;

                context.clearRect(0, 0, width, height);
                context.strokeStyle = '#294047';
                context.lineWidth = ratio;
                for (let line = 0; line <= 4; line += 1) {
                    const y = inset / 2 + graphHeight * line / 4;
                    context.beginPath();
                    context.moveTo(inset, y);
                    context.lineTo(width - inset, y);
                    context.stroke();
                }

                context.fillStyle = '#90a6a7';
                context.font = `${10 * ratio}px ui-monospace, monospace`;
                context.fillText(maximum.toFixed(maximum >= 10 ? 0 : 1), 2 * ratio, 12 * ratio);

                this.series.forEach(item => {
                    context.beginPath();
                    item.values.forEach((value, index) => {
                        const x = inset + graphWidth * index / (item.values.length - 1);
                        const y = inset / 2 + graphHeight * (1 - Math.min(value / maximum, 1));
                        if (index === 0) context.moveTo(x, y);
                        else context.lineTo(x, y);
                    });
                    context.strokeStyle = item.color;
                    context.lineWidth = 2 * ratio;
                    context.stroke();
                });
            }
        }

        const graphs = {
            cpu: new HistoryGraph('cpu-chart', [{color: '#de938a'}], 100),
            mem: new HistoryGraph('mem-chart', [{color: '#a3e6ba'}, {color: '#82c9d7'}], 100),
            net: new HistoryGraph('net-chart', [{color: '#82c9d7'}, {color: '#efb078'}]),
            disk: new HistoryGraph('disk-chart', [{color: '#a3e6ba'}, {color: '#de938a'}]),
        };

        let currentSort = 'cpu_percent';
        let sortDescending = true;
        let latestProcesses = [];

        function setText(id, value) {
            document.getElementById(id).textContent = String(value);
        }

        function renderProcesses() {
            const filter = document.getElementById('proc-filter').value.toLowerCase();
            const processes = latestProcesses.filter(proc => {
                const name = String(proc.name || '').toLowerCase();
                return name.includes(filter) || String(proc.pid || '').includes(filter);
            });

            processes.sort((left, right) => {
                const a = left[currentSort];
                const b = right[currentSort];
                if (currentSort === 'name') {
                    const order = String(a || '').localeCompare(String(b || ''));
                    return sortDescending ? -order : order;
                }
                const order = Number(a || 0) - Number(b || 0);
                return sortDescending ? -order : order;
            });

            const body = document.getElementById('process-list');
            body.replaceChildren();
            processes.slice(0, 15).forEach(proc => {
                const row = document.createElement('tr');
                const pidCell = document.createElement('td');
                pidCell.textContent = String(proc.pid || '');
                const nameCell = document.createElement('td');
                nameCell.textContent = String(proc.name || '');
                const cpuCell = document.createElement('td');
                cpuCell.className = 'numeric';
                cpuCell.textContent = `${Number(proc.cpu_percent || 0).toFixed(1)}%`;
                const memoryCell = document.createElement('td');
                memoryCell.className = 'numeric';
                memoryCell.textContent = `${Number(proc.memory_percent || 0).toFixed(1)}%`;
                row.append(pidCell, nameCell, cpuCell, memoryCell);
                body.appendChild(row);
            });

            if (!body.children.length) {
                const row = document.createElement('tr');
                const cell = document.createElement('td');
                cell.colSpan = 4;
                cell.className = 'empty';
                cell.textContent = filter ? 'No matching processes.' : 'No processes in this sample.';
                row.appendChild(cell);
                body.appendChild(row);
            }
        }

        document.querySelectorAll('[data-sort]').forEach(button => {
            button.addEventListener('click', () => {
                if (currentSort === button.dataset.sort) sortDescending = !sortDescending;
                else {
                    currentSort = button.dataset.sort;
                    sortDescending = true;
                }
                renderProcesses();
            });
        });
        document.getElementById('proc-filter').addEventListener('input', renderProcesses);
        window.addEventListener('resize', () => Object.values(graphs).forEach(graph => graph.resize()));

        const connection = document.getElementById('connection');
        // Exchange a dashboard URL token for the server's HttpOnly cookie, then
        // remove it from the visible URL before opening the native SSE stream.
        const dashboardToken = new URLSearchParams(window.location.search).get('token');
        if (dashboardToken && window.history && window.history.replaceState) {
            window.history.replaceState(
                null,
                document.title,
                `${window.location.pathname}${window.location.hash}`,
            );
        }
        const streamPath = '/api/metrics/stream';
        const eventSource = new EventSource(streamPath, {withCredentials: true});
        eventSource.onopen = () => {
            connection.textContent = 'LIVE / SSE';
            connection.classList.add('live');
        };
        eventSource.onerror = () => {
            connection.textContent = 'RECONNECTING';
            connection.classList.remove('live');
        };
        eventSource.addEventListener('stale', () => {
            connection.textContent = 'STALE / RECONNECTING';
            connection.classList.remove('live');
        });
        eventSource.onmessage = event => {
            try {
                const data = JSON.parse(event.data);
                const system = data.sys || {};
                setText('sys-host', system.hostname || 'N/A');
                setText('sys-kernel', system.kernel || 'N/A');
                setText('sys-uptime', system.uptime || 'N/A');
                setText('sys-tasks', `${system.procs_running || 0} / ${system.procs_total || 0}`);
                setText('sys-fds', `${system.open_fds || 0} / ${system.max_fds || 0}`);
                setText('sys-temp', `${Number(system.cpu_temp || 0).toFixed(1)} C`);

                graphs.cpu.update([data.cpu.total]);
                graphs.mem.update([data.mem.mem.percent, data.mem.swap.percent]);
                graphs.net.update([data.net.down / 1024, data.net.up / 1024]);
                const disk = data.disk && data.disk.io ? data.disk.io : {};
                graphs.disk.update([
                    Number(disk.read_bytes || 0) / (1024 * 1024),
                    Number(disk.write_bytes || 0) / (1024 * 1024),
                ]);

                latestProcesses = Array.isArray(data.procs) ? data.procs.slice() : [];
                renderProcesses();
            } catch (error) {
                connection.textContent = 'INVALID SAMPLE';
                connection.classList.remove('live');
            }
        };
    </script>
</body>
</html>
