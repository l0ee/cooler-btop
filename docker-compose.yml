services:
  cooler-btop:
    build: .
    container_name: cooler_btop_daemon
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/metrics', timeout=5).read(1)"]
      interval: 30s
      timeout: 6s
      retries: 3
